name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck hud/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: hud/
          severity: warning

      - name: ShellCheck tools/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: tools/
          severity: warning

      - name: ShellCheck tmux/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: tmux/
          severity: warning

      - name: ShellCheck install/uninstall
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: warning
          additional_files: install.sh uninstall.sh

      - name: Validate JSON files
        run: |
          for f in \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .agents/plugins/marketplace.json \
            plugins/forge-glow/.codex-plugin/plugin.json; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null || { echo "INVALID: $f"; exit 1; }
          done
          echo "All JSON valid"

      - name: Release surface consistency
        run: bash tools/check-release.sh

      - name: Plugin manager dry run
        run: |
          FORGE_GLOW_DRY_RUN=1 bash tools/plugin-manager.sh install all
          FORGE_GLOW_DRY_RUN=1 bash tools/plugin-manager.sh update all

      - name: HUD and parser regression tests
        run: bash test/parity/run.sh

      - name: Install and uninstall regression tests
        run: bash test/install/run.sh

      - name: Python syntax
        run: python3 -m compileall -q stats/src

      - name: self-update dry run (no remote)
        run: |
          export FORGE_GLOW_DIR="$GITHUB_WORKSPACE"
          export FORGE_GLOW_STATE_DIR="/tmp/fg-state-$$"
          export FORGE_GLOW_UPDATE_INTERVAL=0
          bash tools/self-update.sh
          echo "self-update.sh exit 0 (no remote in CI = 정상 스킵)"
